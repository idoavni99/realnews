<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>realnews - הסיפור משני הצדדים</title>
<style>
:root {
  --bg: #f4efec; --card: #ffffff; --ink: #251f21; --ink2: #585254; --hairline: #eae9ea;
  /* Left = red, right = blue, center = neutral. Solid colors keep >= 4.5:1 with white text; ink colors keep >= 4.5:1 on their tint. */
  --left: #c4283a; --left-ink: #9d1c2c; --left-tint: #fdecee;
  --right: #1f5ec4; --right-ink: #174a9c; --right-tint: #e8f0fc;
  --cleft:#e0838f; --cleft-ink:#9d1c2c; --cleft-tint:#fff5f6; --cright:#7fa6e0; --cright-ink:#174a9c; --cright-tint:#f3f7fd;
  --center: #6e6769; --center-ink: #4b4547; --center-tint: #f0eeee;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; line-height: 1.5; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px calc(48px + env(safe-area-inset-bottom)); }
header.top { position: sticky; top: 0; background: var(--bg); z-index: 10; padding: calc(18px + env(safe-area-inset-top)) 16px 12px; border-bottom: 1px solid var(--hairline); }
header.top h1 { font-size: 20px; font-weight: 700; }
header.top .meta { color: var(--ink2); font-size: 12px; margin-top: 2px; }
.banner { background: #fff8e6; border: 1px solid #efe0b3; border-radius: 10px; padding: 10px 14px; margin: 14px 0 0; font-size: 13px; color: var(--ink2); }
.card { display: block; background: var(--card); border-radius: 16px; padding: 18px; margin-top: 14px; text-decoration: none; color: inherit; box-shadow: 0 1px 2px rgba(37,31,33,.05); transition: background .12s ease; }
.card:active { background: #f6f3f1; }
.card h2 { font-size: 17px; font-weight: 700; line-height: 1.4; }
.card .sum { color: var(--ink2); font-size: 14px; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cov { margin-top: 14px; }
.cov-bar { display: flex; height: 22px; border-radius: 11px; overflow: hidden; background: var(--hairline); gap: 2px; }
.cov-bar div { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; min-width: 0; white-space: nowrap; }
.seg-right { background: var(--right); } .seg-center { background: var(--center); } .seg-left { background: var(--left); }
.cov-legend { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.cov-legend .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; border-radius: 12px; padding: 3px 10px; border: 1px solid transparent; }
.chip.right { background: var(--right-tint); color: var(--right-ink); border-color: var(--right); }
.chip.left { background: var(--left-tint); color: var(--left-ink); border-color: var(--left); }
.chip.center { background: var(--center-tint); color: var(--center-ink); border-color: var(--center); }
.chip.off { background: transparent; color: var(--ink2); border-style: dashed; font-weight: 400; }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.chip.off i { background: transparent !important; border: 1px dashed currentColor; }
.nobar { font-size: 13px; color: var(--ink2); background: var(--bg); border-radius: 8px; padding: 8px 12px; }
.overlay { position: fixed; inset: 0; background: var(--bg); z-index: 20; overflow-y: auto; display: none; }
.overlay.open { display: block; }
.ov-head { position: sticky; top: 0; background: var(--bg); padding: calc(14px + env(safe-area-inset-top)) 16px 14px; border-bottom: 1px solid var(--hairline); display: flex; align-items: center; gap: 12px; }
.ov-head button { border: 1px solid var(--hairline); background: var(--card); border-radius: 20px; padding: 8px 16px; font-size: 14px; min-height: 44px; cursor: pointer; color: var(--ink); }
.ov-body { max-width: 640px; margin: 0 auto; padding: 18px 16px calc(48px + env(safe-area-inset-bottom)); }
.ov-body h2 { font-size: 20px; line-height: 1.4; }
.ov-body .sum { color: var(--ink2); font-size: 15px; margin-top: 10px; }
h3.sec { font-size: 15px; margin: 22px 0 10px; }
.src { background: var(--card); border-radius: 12px; padding: 14px 16px; margin-top: 8px; display: block; text-decoration: none; color: inherit; }
.src .name { font-weight: 700; font-size: 14px; }
.src .title { color: var(--ink2); font-size: 14px; margin-top: 4px; }
.src .go { color: var(--ink2); font-size: 12px; margin-top: 6px; }
.side-tag { font-size: 11px; font-weight: 600; border: 1px solid var(--hairline); border-radius: 10px; padding: 1px 8px; margin-inline-start: 8px; }
.side-tag.right { background: var(--right-tint); color: var(--right-ink); border-color: var(--right); }
.side-tag.left { background: var(--left-tint); color: var(--left-ink); border-color: var(--left); }
.side-tag.center { background: var(--center-tint); color: var(--center-ink); border-color: var(--center); }
.src { border-inline-start: 4px solid var(--hairline); }
.src.right { border-inline-start-color: var(--right); } .src.left { border-inline-start-color: var(--left); } .src.center { border-inline-start-color: var(--center); }
.side-summary { background:var(--card); border-radius:12px; padding:0 16px 16px; margin-top:10px; border-top: 4px solid var(--hairline); overflow: hidden; }
.side-summary.right { border-top-color: var(--right); } .side-summary.left { border-top-color: var(--left); } .side-summary.center { border-top-color: var(--center); }
.side-summary h3 { font-size:15px; font-weight: 700; margin: 0 -16px 8px; padding: 8px 16px; }
.side-summary.right h3 { background: var(--right-tint); color: var(--right-ink); }
.side-summary.left h3 { background: var(--left-tint); color: var(--left-ink); }
.side-summary.center h3 { background: var(--center-tint); color: var(--center-ink); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--right); outline-offset: 2px; }
.side-summary p { font-size:15px; line-height:1.7; margin-top:8px; }
.evidence { display:block; font-size:12px; color:var(--ink2); margin-top:5px; }
.note { font-size:13px; color:var(--ink2); margin-top:12px; }
footer.health { margin-top: 28px; color: var(--ink2); font-size: 12px; }
.stale { color: #b04a4a; font-weight: 600; }
footer.health .ok { color: #4a7d5d; } footer.health .bad { color: #b04a4a; }

.side-tag.center_left { background: var(--cleft-tint); color: var(--cleft-ink); border-color: var(--cleft); }
.side-tag.center_right { background: var(--cright-tint); color: var(--cright-ink); border-color: var(--cright); }
.src.center_left { border-inline-start-color: var(--cleft); } .src.center_right { border-inline-start-color: var(--cright); }
.grp { font-size:15px; font-weight:700; margin:18px 4px 8px; padding:6px 12px; border-radius:8px; border-inline-start:6px solid; }
.grp.left { background: var(--left-tint); color: var(--left-ink); border-color: var(--left); }
.grp.right { background: var(--right-tint); color: var(--right-ink); border-color: var(--right); }
.grp.center { background: var(--center-tint); color: var(--center-ink); border-color: var(--center); }
.grp.unlabeled { background: transparent; color: var(--ink2); border-color: var(--hairline); font-weight:400; }
.chip.sub { font-weight: 400; }
</style>
</head>
<body>
<header class="top"><div class="wrap" style="padding-bottom:0">
  <h1>הסיפור משני הצדדים</h1>
  <div class="meta" id="meta">טוען…</div>
  <div class="banner" id="banner" hidden></div>
</div></header>
<main class="wrap" id="feed"></main>
<div class="overlay" id="overlay">
  <div class="ov-head"><button id="back" type="button">→ חזרה</button></div>
  <div class="ov-body" id="detail"></div>
</div>
<script>
const SIDE_HE = { right: 'ימין', center_right: 'מרכז־ימין', center: 'מרכז', center_left: 'מרכז־שמאל', left: 'שמאל', unknown: 'ללא תיוג' };
const GROUP_SIDES = { right: ['right', 'center_right'], center: ['center'], left: ['left', 'center_left'] };
const SIDE_ORDER = ['right', 'center', 'left']; // display groups
// center_left = 0.5 left + 0.5 center; center_right = 0.5 right + 0.5 center
const WEIGHTS = { left: { left: 1 }, center: { center: 1 }, right: { right: 1 },
  center_left: { left: .5, center: .5 }, center_right: { right: .5, center: .5 } };
let DATA = null;

function articlesLabel(n) { return n === 1 ? 'כתבה אחת' : n + ' כתבות'; }
const groupMonitored = g => GROUP_SIDES[g].some(s => DATA.monitored_sides.includes(s));
const groupCount = (story, g) => GROUP_SIDES[g].reduce((a, s) => a + (DATA.monitored_sides.includes(s) ? (story.counts[s] || 0) : 0), 0);
function weighted(story) {
  const w = { left: 0, center: 0, right: 0 };
  for (const s of Object.keys(WEIGHTS)) if (DATA.monitored_sides.includes(s))
    for (const g in WEIGHTS[s]) w[g] += WEIGHTS[s][g] * (story.counts[s] || 0);
  return w;
}
/* Each story sits once, under the group with most actual articles (ties: center, right, left). Other groups show in its legend. */
function primaryGroup(story) {
  let best = null, n = 0;
  for (const g of ['center', 'right', 'left']) { const c = groupCount(story, g); if (c > n) { best = g; n = c; } }
  return best;
}

function coverageHtml(story) {
  const groups = SIDE_ORDER.filter(groupMonitored);
  const w = weighted(story);
  const counted = groups.reduce((a, g) => a + w[g], 0);
  if (groups.length < 2 || counted === 0) {
    return `<div class="cov"><div class="nobar">${articlesLabel(story.total)} · תיוג צדדים טרם הושלם</div></div>`;
  }
  const pct = g => Math.round(w[g] / counted * 100);
  const segs = groups.filter(g => w[g]).map(g =>
    `<div class="seg-${g}" style="width:${pct(g)}%" title="${SIDE_HE[g]} ${pct(g)}%">${pct(g) >= 14 ? pct(g) + '%' : ''}</div>`).join('');
  const legend = groups.map(g => {
    const n = groupCount(story, g);
    const parts = GROUP_SIDES[g].filter(s => DATA.monitored_sides.includes(s) && story.counts[s]).map(s => `${SIDE_HE[s]} ${story.counts[s]}`);
    const detail = parts.length > 1 || (parts.length === 1 && parts[0].indexOf('מרכז־') === 0) ? ` (${parts.join(' + ')})` : '';
    const txt = n === 0 && !w[g] ? `${SIDE_HE[g]} · אין כתבות` : `${SIDE_HE[g]} ${pct(g)}% · ${articlesLabel(n)}${detail}`;
    return `<span class="chip ${n === 0 && !w[g] ? 'off' : g}"><i class="seg-${g}"></i>${txt}</span>`;
  }).join('');
  return `<div class="cov"><div class="cov-bar">${segs}</div><div class="cov-legend">${legend}</div></div>`;
}

function renderFeed() {
  const staleH = (Date.now() - new Date(DATA.generated_at).getTime()) / 36e5;
  const card = (s, i) => `
    <a class="card" href="#/story/${i}">
      <h2>${esc(s.headline)}</h2>
      <div class="sum">${esc(s.summary)}</div>
      ${coverageHtml(s)}
    </a>`;
  const bucket = {};
  DATA.stories.forEach((s, i) => (bucket[primaryGroup(s) || 'unlabeled'] = bucket[primaryGroup(s) || 'unlabeled'] || []).push(card(s, i)));
  const titles = { right: 'ימין + מרכז־ימין', center: 'מרכז', left: 'שמאל + מרכז־שמאל', unlabeled: 'ללא תיוג צדדים' };
  document.getElementById('feed').innerHTML = [...SIDE_ORDER, 'unlabeled'].filter(g => bucket[g]).map(g =>
    `<h2 class="grp ${g}">${titles[g]}</h2>` + bucket[g].join('')).join('') +
    `<footer class="health">מקורות: ${Object.entries(DATA.source_health).map(([id, h]) =>
      `<span class="${h.ok ? 'ok' : 'bad'}">${esc(h.name)}${h.ok ? '' : h.status === 'no_recent_items' ? ' (אין כתבות עדכניות בפיד)' : ' (תקלה)'}</span>`).join(' · ')}
    <br>עודכן: ${new Date(DATA.generated_at).toLocaleString('he-IL')} · חלון ${DATA.window_hours} שעות
    ${staleH > 36 ? '<br><span class="stale">הנתונים לא התעדכנו לאחרונה - ייתכן שהריצה היומית מושהית.</span>' : ''}</footer>`;
}

function sideSummariesHtml(s) {
  const ready = s.synthesis_status === 'ready' && s.synthesis;
  const intro = ready ? 'סיכומים אוטומטיים שנבדקו מול הטקסט שנאסף. גם בדיקה אוטומטית עלולה לטעות.' : 'הסיכום לפי צד אינו זמין כרגע. לא מוצג סיכום שלא עבר את הבדיקה.';
  return `<h3 class="sec">מה מדווחים לפי צד</h3><p class="note">${intro}</p>` + SIDE_ORDER.map(side => {
    const found=s.articles.some(a=>GROUP_SIDES[side].includes(a.side));
    const rows=ready ? s.synthesis.sides[side]?.summary || [] : [];
    const absent=groupMonitored(side) ? 'לא נמצאו כתבות בנושא במקורות שבמעקב.' : 'הצד הזה אינו במעקב כרגע.';
    return `<section class="side-summary ${side}"><h3>${SIDE_HE[side]}</h3>${rows.length ? rows.map(row=>`<p>${esc(row.text)}<span class="evidence">מקורות: ${row.article_ids.map(id=>s.articles[id]).filter(Boolean).map(a=>esc(a.source)).join(' · ')}</span></p>`).join('') : `<p>${!found ? absent : 'יש כתבות, אך אין סיכום מאומת זמין.'}</p>`}</section>`;
  }).join('') + (s.caveats||[]).map(c=>`<p class="note">${esc(c)}</p>`).join('');
}

function renderDetail(i) {
  const s = DATA.stories[i];
  if (!s) return closeDetail();
  const bySide = {};
  s.articles.forEach(a => (bySide[a.side] = bySide[a.side] || []).push(a));
  document.getElementById('detail').innerHTML = `
    <h2>${esc(s.headline)}</h2>
    ${coverageHtml(s)}
    ${sideSummariesHtml(s)}
    <h3 class="sec">מקורות לעיון (לא חובה)</h3>
    ${Object.entries(bySide).map(([side, arts]) => arts.map(a => `
      <a class="src ${side}" href="${a.url}" target="_blank" rel="noopener">
        <span class="name">${esc(a.source)}</span><span class="side-tag ${side}">${SIDE_HE[side] || SIDE_HE.unknown}${a.extraction === 'lead_only' ? ' · פתיח בלבד' : a.extraction === 'partial' ? ' · טקסט חלקי' : ''}</span>
        <div class="title">${esc(a.title)}</div>
        <div class="go">לכתבה המלאה באתר המקור ↗</div>
      </a>`).join('')).join('')}`;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('overlay').scrollTop = 0;
}

function closeDetail() { document.getElementById('overlay').classList.remove('open'); location.hash = '#/'; }
function esc(t) { const d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }

function route() {
  const m = location.hash.match(/^#\/story\/(\d+)/);
  if (m) renderDetail(+m[1]); else document.getElementById('overlay').classList.remove('open');
}

function ago(iso) {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (m < 60) return 'לפני ' + m + ' דקות';
  const h = Math.floor(m / 60);
  if (h < 24) return 'לפני ' + (h === 1 ? 'שעה' : h + ' שעות');
  const d = Math.floor(h / 24);
  return 'לפני ' + (d === 1 ? 'יום' : d + ' ימים');
}

fetch('data.json').then(r => r.json()).then(d => {
  DATA = d;
  document.getElementById('meta').textContent = 'עודכן ' + ago(d.generated_at);
  const unmonitored = SIDE_ORDER.filter(g => !GROUP_SIDES[g].some(s => d.monitored_sides.includes(s)));
  if (unmonitored.length) {
    const b = document.getElementById('banner');
    b.hidden = false;
    b.textContent = 'שים לב: ' + unmonitored.map(s => SIDE_HE[s]).join(', ') +
      ' אינם במעקב כרגע (מקורות לא מתויגים או תקלה). הפסים מחושבים רק על צדדים במעקב.';
  }
  renderFeed(); route();
}).catch(() => { document.getElementById('meta').textContent = 'שגיאה בטעינת הנתונים'; });

window.addEventListener('hashchange', route);
document.getElementById('back').addEventListener('click', closeDetail);
</script>
</body>
</html>

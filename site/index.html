<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>realnews - הסיפור משני הצדדים</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="theme-color" content="#f4efec">
<meta name="apple-mobile-web-app-title" content="realnews">
<style>
:root {
  --bg: #f4efec; --card: #ffffff; --ink: #251f21; --ink2: #585254; --hairline: #eae9ea;
  /* Left = red, right = blue, center = neutral. Solid colors keep >= 4.5:1 with white text; ink colors keep >= 4.5:1 on their tint. */
  --left: #c4283a; --left-ink: #9d1c2c; --left-tint: #fdecee;
  --right: #1f5ec4; --right-ink: #174a9c; --right-tint: #e8f0fc;
  --cleft:#e0838f; --cleft-ink:#9d1c2c; --cleft-tint:#fff5f6; --cright:#7fa6e0; --cright-ink:#174a9c; --cright-tint:#f3f7fd;
  --center: #6e6769; --center-ink: #4b4547; --center-tint: #f0eeee;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; line-height: 1.5; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px calc(48px + env(safe-area-inset-bottom)); }
header.top { position: sticky; top: 0; background: var(--bg); z-index: 10; padding: calc(18px + env(safe-area-inset-top)) 16px 12px; border-bottom: 1px solid var(--hairline); }
header.top h1 { font-size: 20px; font-weight: 700; }
header.top .meta { color: var(--ink2); font-size: 12px; margin-top: 2px; }
.banner { background: #fff8e6; border: 1px solid #efe0b3; border-radius: 10px; padding: 10px 14px; margin: 14px 0 0; font-size: 13px; color: var(--ink2); }
.card { display: block; background: var(--card); border-radius: 16px; padding: 18px; margin-top: 14px; text-decoration: none; color: inherit; box-shadow: 0 1px 2px rgba(37,31,33,.05); transition: background .12s ease; }
.card:active { background: #f6f3f1; }
.card h2 { font-size: 17px; font-weight: 700; line-height: 1.4; }
.card .sum { color: var(--ink2); font-size: 14px; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cov { margin-top: 14px; }
.cov-bar { display: flex; height: 22px; border-radius: 11px; overflow: hidden; background: var(--hairline); gap: 2px; }
.cov-bar div { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; min-width: 0; white-space: nowrap; }
.seg-right { background: var(--right); } .seg-center { background: var(--center); } .seg-left { background: var(--left); }
.cov-legend { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.cov-legend .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; border-radius: 12px; padding: 3px 10px; border: 1px solid transparent; }
.chip.right { background: var(--right-tint); color: var(--right-ink); border-color: var(--right); }
.chip.left { background: var(--left-tint); color: var(--left-ink); border-color: var(--left); }
.chip.center { background: var(--center-tint); color: var(--center-ink); border-color: var(--center); }
.chip.off { background: transparent; color: var(--ink2); border-style: dashed; font-weight: 400; }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.chip.off i { background: transparent !important; border: 1px dashed currentColor; }
.nobar { font-size: 13px; color: var(--ink2); background: var(--bg); border-radius: 8px; padding: 8px 12px; }
.overlay { position: fixed; inset: 0; background: var(--bg); z-index: 20; overflow-y: auto; display: none; }
.overlay.open { display: block; }
.ov-head { position: sticky; top: 0; background: var(--bg); padding: calc(14px + env(safe-area-inset-top)) 16px 14px; border-bottom: 1px solid var(--hairline); display: flex; align-items: center; gap: 12px; }
.ov-head button { border: 1px solid var(--hairline); background: var(--card); border-radius: 20px; padding: 8px 16px; font-size: 14px; min-height: 44px; cursor: pointer; color: var(--ink); }
.ov-body { max-width: 640px; margin: 0 auto; padding: 18px 16px calc(48px + env(safe-area-inset-bottom)); }
.ov-body h2 { font-size: 20px; line-height: 1.4; }
.ov-body .sum { color: var(--ink2); font-size: 15px; margin-top: 10px; }
h3.sec { font-size: 15px; margin: 22px 0 10px; }
.src { background: var(--card); border-radius: 12px; padding: 14px 16px; margin-top: 8px; display: block; text-decoration: none; color: inherit; }
.src .name { font-weight: 700; font-size: 14px; }
.src .title { color: var(--ink2); font-size: 14px; margin-top: 4px; }
.src .go { color: var(--ink2); font-size: 12px; margin-top: 6px; }
.side-tag { font-size: 11px; font-weight: 600; border: 1px solid var(--hairline); border-radius: 10px; padding: 1px 8px; margin-inline-start: 8px; }
.side-tag.right { background: var(--right-tint); color: var(--right-ink); border-color: var(--right); }
.side-tag.left { background: var(--left-tint); color: var(--left-ink); border-color: var(--left); }
.side-tag.center { background: var(--center-tint); color: var(--center-ink); border-color: var(--center); }
.src { border-inline-start: 4px solid var(--hairline); }
.src.right { border-inline-start-color: var(--right); } .src.left { border-inline-start-color: var(--left); } .src.center { border-inline-start-color: var(--center); }
.side-summary { background:var(--card); border-radius:12px; padding:0 16px 16px; margin-top:10px; border-top: 4px solid var(--hairline); overflow: hidden; }
.side-summary.right { border-top-color: var(--right); } .side-summary.left { border-top-color: var(--left); } .side-summary.center { border-top-color: var(--center); }
.side-summary h3 { font-size:15px; font-weight: 700; margin: 0 -16px 8px; padding: 8px 16px; }
.side-summary.right h3 { background: var(--right-tint); color: var(--right-ink); }
.side-summary.left h3 { background: var(--left-tint); color: var(--left-ink); }
.side-summary.center h3 { background: var(--center-tint); color: var(--center-ink); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--right); outline-offset: 2px; }
.side-summary p { font-size:15px; line-height:1.7; margin-top:8px; }
/* Raw RSS fallback: unverified source text must never read as a verified summary. */
.raw-rss { background:#fff8e6; border:1.5px dashed #d9b45c; border-radius:10px; padding:10px 12px; margin-top:8px; }
.raw-rss .raw-badge { display:inline-block; font-size:11px; font-weight:700; color:#7a5b00; background:#f7e9c3; border:1px solid #e3cd8f; border-radius:10px; padding:1px 8px; margin-bottom:6px; }
.raw-rss p { font-size:14px; margin-top:2px; }
.raw-rss .raw-src, .side-summary > .raw-src { display:block; font-size:12px; color:var(--ink2); margin-top:6px; }
.raw-src a { color:inherit; }
.evidence { display:block; font-size:12px; color:var(--ink2); margin-top:5px; }
.note { font-size:13px; color:var(--ink2); margin-top:12px; }
footer.health { margin-top: 28px; color: var(--ink2); font-size: 12px; }
.stale { color: #b04a4a; font-weight: 600; }
footer.health .ok { color: #4a7d5d; } footer.health .bad { color: #b04a4a; }

.side-tag.center_left { background: var(--cleft-tint); color: var(--cleft-ink); border-color: var(--cleft); }
.side-tag.center_right { background: var(--cright-tint); color: var(--cright-ink); border-color: var(--cright); }
.src.center_left { border-inline-start-color: var(--cleft); } .src.center_right { border-inline-start-color: var(--cright); }
.grp { font-size:15px; font-weight:700; margin:18px 4px 8px; padding:6px 12px; border-radius:8px; border-inline-start:6px solid; }
.grp.left { background: var(--left-tint); color: var(--left-ink); border-color: var(--left); }
.grp.right { background: var(--right-tint); color: var(--right-ink); border-color: var(--right); }
.grp.center { background: var(--center-tint); color: var(--center-ink); border-color: var(--center); }
.grp.unlabeled { background: transparent; color: var(--ink2); border-color: var(--hairline); font-weight:400; }
/* Coverage-difference bullets: one compact card at the top of the story screen. */
.diff { background: var(--card); border-radius: 12px; padding: 10px 16px 12px; margin-top: 4px; border-top: 4px solid transparent; border-image: linear-gradient(to left, var(--right) 50%, var(--left) 50%) 1; }
.diff ul { list-style: none; }
.diff li { font-size: 14px; line-height: 1.6; padding-inline-start: 14px; position: relative; margin-top: 6px; }
.diff li::before { content: ""; position: absolute; inset-inline-start: 0; top: 9px; width: 7px; height: 7px; border-radius: 50%; background: linear-gradient(to left, var(--right) 50%, var(--left) 50%); }
.diff li b.r { color: var(--right-ink); }
.diff li b.l { color: var(--left-ink); }
.diff .srcs { font-size: 12px; font-weight: 600; }
.diff .srcs a { text-decoration: none; }
.diff .srcs.right a { color: var(--right-ink); }
.diff .srcs.left a { color: var(--left-ink); }
.diff .none { font-size: 14px; color: var(--ink2); }
.diff .note { margin-top: 8px; }
.chip.sub { font-weight: 400; }
.cov-cap{font-size:12px;color:var(--ink2);margin-bottom:4px}
.feed-tools{display:grid;gap:10px;margin-top:14px}.feed-tools label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}.feed-tools input,.feed-tools select{font:inherit;font-size:16px;min-height:44px;width:100%;min-width:0;border:1px solid #cfc8ca;border-radius:10px;background:var(--card);color:var(--ink);padding:9px 12px}.tool-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}.reset{min-height:44px;padding:8px 14px;border:1px solid #cfc8ca;border-radius:10px;background:white;color:var(--ink);font:inherit;cursor:pointer}.banner button{font:inherit;font-size:13px;min-height:32px;padding:4px 12px;margin-inline-start:8px;border:1px solid #cfc8ca;border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}.results{font-size:13px;color:var(--ink2);margin-top:10px}.empty{padding:30px 12px;text-align:center;color:var(--ink2)}
@media(min-width:600px){.feed-tools{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:end}}
</style>
</head>
<body>
<header class="top"><div class="wrap" style="padding-bottom:0">
  <h1>הסיפור משני הצדדים</h1>
  <div class="meta" id="meta">טוען…</div>
  <form class="feed-tools" id="feed-tools" role="search">
    <div><label for="search">חיפוש בכתבות</label><input id="search" name="q" type="search" placeholder="כותרת, טקסט או מקור" autocomplete="off"></div>
    <div class="tool-row"><div><label for="affiliation">שיוך המקורות</label><select id="affiliation" name="side"><option value="">כל השיוכים</option><option value="right">ימין</option><option value="center_right">מרכז־ימין</option><option value="center">מרכז</option><option value="center_left">מרכז־שמאל</option><option value="left">שמאל</option><option value="unknown">ללא תיוג</option></select></div><button class="reset" type="button" id="reset">ניקוי</button></div>
    <div id="edition-row" hidden><label for="edition">מהדורה</label><select id="edition" name="edition"><option value="">המהדורה האחרונה</option></select></div>
  </form>
  <div class="banner" id="edition-banner" hidden></div>
  <div class="banner" id="banner" hidden></div>
  <div class="banner" id="grouping-warning" role="alert" hidden></div>
</div></header>
<main class="wrap" id="feed"></main>
<div class="overlay" id="overlay">
  <div class="ov-head"><button id="back" type="button">→ חזרה</button></div>
  <div class="ov-body" id="detail"></div>
</div>
<script>
const SIDE_HE = { right: 'ימין', center_right: 'מרכז־ימין', center: 'מרכז', center_left: 'מרכז־שמאל', left: 'שמאל', unknown: 'ללא תיוג' };
const GROUP_SIDES = { right: ['right', 'center_right'], center: ['center'], left: ['left', 'center_left'] };
const SIDE_ORDER = ['right', 'center', 'left']; // display groups
// center_left = 0.5 left + 0.5 center; center_right = 0.5 right + 0.5 center
const WEIGHTS = { left: { left: 1 }, center: { center: 1 }, right: { right: 1 },
  center_left: { left: .5, center: .5 }, center_right: { right: .5, center: .5 } };
let DATA = null;
let EDITIONS = [];
let CURRENT_EDITION = '';

function editionLabel(e) {
  return new Date(e.generated_at).toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function editionUrl(id) { return id ? 'history/' + encodeURIComponent(id) + '.json' : 'data.json'; }
function readEdition() {
  const id = new URLSearchParams(location.search).get('edition') || '';
  return EDITIONS.some(e => e.id === id) ? id : '';
}
function populateEditions() {
  const select = document.getElementById('edition');
  select.innerHTML = '<option value="">המהדורה האחרונה</option>' +
    EDITIONS.map(e => `<option value="${esc(e.id)}">מהדורה מ-${esc(editionLabel(e))}</option>`).join('');
  document.getElementById('edition-row').hidden = EDITIONS.length === 0;
}

function articlesLabel(n) { return n === 1 ? 'כתבה אחת' : n + ' כתבות'; }
const groupMonitored = g => GROUP_SIDES[g].some(s => DATA.monitored_sides.includes(s));
const groupCount = (story, g) => GROUP_SIDES[g].reduce((a, s) => a + (DATA.monitored_sides.includes(s) ? (story.counts[s] || 0) : 0), 0);
function weighted(story) {
  const w = { left: 0, center: 0, right: 0 };
  for (const s of Object.keys(WEIGHTS)) if (DATA.monitored_sides.includes(s))
    for (const g in WEIGHTS[s]) w[g] += WEIGHTS[s][g] * (story.counts[s] || 0);
  return w;
}
/* A story appears in every group that has an actual article by raw owner label. Weight alone never adds a group. */
function storyGroups(story) { return SIDE_ORDER.filter(g => groupCount(story, g) > 0); }

function coverageHtml(story) {
  if(story.grouping_status==='unvalidated')return '<p class="note">נתוני כיסוי לפי אירוע אינם זמינים לקיבוץ שלא אומת.</p>';
  const partialNote = DATA.grouping?.partial ? '<p class="note">הסיקור חלקי - האחוזים משקפים רק את הכתבות שפורסמו, לא את כל הכתבות שנאספו.</p>' : '';
  const groups = SIDE_ORDER.filter(groupMonitored);
  const w = weighted(story);
  const counted = groups.reduce((a, g) => a + w[g], 0);
  if (groups.length < 2 || counted === 0) {
    return partialNote + `<div class="cov"><div class="nobar">${articlesLabel(story.total)} · תיוג צדדים טרם הושלם</div></div>`;
  }
  const pct = g => Math.round(w[g] / counted * 100);
  const segs = groups.filter(g => w[g]).map(g =>
    `<div class="seg-${g}" style="width:${pct(g)}%" title="${SIDE_HE[g]} ${pct(g)}%">${pct(g) >= 14 ? pct(g) + '%' : ''}</div>`).join('');
  const half = ['center_left', 'center_right'].filter(x => DATA.monitored_sides.includes(x) && story.counts[x]);
  const legend = groups.map(g => {
    const n = groupCount(story, g);
    const parts = GROUP_SIDES[g].filter(s => DATA.monitored_sides.includes(s) && story.counts[s]).map(s => `${SIDE_HE[s]} ${story.counts[s]}`);
    const detail = parts.length > 1 || (parts.length === 1 && parts[0].indexOf('מרכז־') === 0) ? ` (${parts.join(' + ')})` : '';
    const viaHalf = g === 'center' ? half.map(x => SIDE_HE[x]) : [];
    const off = n === 0 && !w[g];
    const via = !viaHalf.length ? '' : n === 0 ? ' · חצי ממשקל ' + viaHalf.join(' ו') : ' · כולל חצי ממשקל ' + viaHalf.join(' ו');
    const txt = off ? `${SIDE_HE[g]} · אין כתבות`
      : `${SIDE_HE[g]} ${pct(g)}%${half.length ? ' משוקלל' : ''} · ${n === 0 ? '0 כתבות' : articlesLabel(n)}${detail}${via}`;
    return `<span class="chip ${off ? 'off' : g}"><i class="seg-${g}"></i>${txt}</span>`;
  }).join('');
  return partialNote + `<div class="cov">${half.length ? '<div class="cov-cap">כיסוי משוקלל (מרכז־שמאל ומרכז־ימין = חצי משקל)</div>' : ''}<div class="cov-bar">${segs}</div><div class="cov-legend">${legend}</div></div>`;
}

// Search is over the text actually available in the published digest, not external paywalled text.
function readFilters() {
  const params=new URLSearchParams(location.search), raw=params.get('side')||'';
  return {q:params.get('q')||'',side:Object.hasOwn(SIDE_HE,raw)?raw:''};
}
function matchesStory(story,state) {
  const normalize=text=>String(text||'').normalize('NFKC').toLocaleLowerCase('he').replace(/\s+/g,' ').trim();
  const query=normalize(state.q),terms=query.split(' ').filter(Boolean);
  // A joint search/filter must match the SAME article, not another source in the story.
  return story.articles.some(article=> (!state.side||(article.side||'unknown')===state.side) &&
    terms.every(term=>normalize([article.title,article.summary,article.source,article.fulltext||''].join(' ')).includes(term)));
}
function syncControls() {const state=readFilters();document.getElementById('search').value=state.q;document.getElementById('affiliation').value=state.side;document.getElementById('edition').value=readEdition();}
function updateFilters() {
  const url=new URL(location.href),q=document.getElementById('search').value,side=document.getElementById('affiliation').value;
  if(q.trim())url.searchParams.set('q',q);else url.searchParams.delete('q');
  if(side)url.searchParams.set('side',side);else url.searchParams.delete('side');
  history.replaceState(null,'',url);if(DATA)renderFeed();
}
function groupingWarning(s) {
  return s.grouping_status==='unvalidated' ? '<p class="note" role="status">קיבוץ הכתבות לא אומת. אין להסיק שזהו אירוע נפרד או שכיסויו מלא.</p>' : '';
}
function renderFeed() {
  const staleH = (Date.now() - new Date(DATA.generated_at).getTime()) / 36e5;
  const card = (s, i) => `
    <a class="card" href="#/story/${i}">
      <h2>${esc(s.headline)}</h2>
      ${groupingWarning(s)}
      <div class="sum">${esc(s.summary)}</div>
      ${coverageHtml(s)}
    </a>`;
  const state=readFilters();
  const visible=DATA.stories.map((story,index)=>({story,index})).filter(({story})=>matchesStory(story,state));
  document.getElementById('feed').innerHTML = (DATA.grouping?.partial ? `<p class="note" role="status">סיקור חלקי: ${DATA.grouping.omitted_articles} כתבות הושמטו עקב קיבוץ שלא אומת. מוצגים רק הסיפורים שעברו את בדיקות הקיבוץ.</p>` : '') + `<p class="results" role="status">${visible.length} מתוך ${DATA.stories.length} סיפורים</p>` +
    (visible.length?visible.map(({story,index})=>card(story,index)).join(''):'<p class="empty">לא נמצאו סיפורים התואמים לחיפוש ולסינון.</p>') +
    `<footer class="health">מקורות: ${Object.entries(DATA.source_health).map(([id, h]) =>
      `<span class="${h.ok ? 'ok' : 'bad'}">${esc(h.name)}${h.ok ? '' : h.status === 'no_recent_items' ? ' (אין כתבות עדכניות בפיד)' : ' (תקלה)'}</span>`).join(' · ')}
    <br>עודכן: ${new Date(DATA.generated_at).toLocaleString('he-IL')} · חלון ${DATA.window_hours} שעות
    ${!CURRENT_EDITION && staleH > 36 ? '<br><span class="stale">הנתונים לא התעדכנו לאחרונה - ייתכן שהריצה היומית מושהית.</span>' : ''}</footer>`;
}

/* A side with one source shows that source's RSS summary as published, with plain
   attribution and no warning badge. Only a multi-source side whose merged summary is
   missing keeps the unverified styling: there the excerpt stands in for failed work. */
function sideSourceCount(s, side) {
  return new Set(s.articles.filter(a=>GROUP_SIDES[side].includes(a.side)).map(a=>a.source)).size;
}
function rawRssHtml(s, side) {
  const first=s.articles.find(a=>GROUP_SIDES[side].includes(a.side) && (a.summary||'').trim());
  if(!first) return `<p>יש כתבות, אך אין סיכום מאומת זמין.</p>`;
  if(sideSourceCount(s, side)<=1)
    return `<p>${esc(first.summary)}</p><span class="raw-src">תקציר הכתבה כפי שהתפרסם בפיד של <a href="${first.url}" target="_blank" rel="noopener">${esc(first.source)}</a>.</span>`;
  return `<div class="raw-rss" role="note"><span class="raw-badge">תקציר RSS גולמי · לא עבר אימות</span><p>${esc(first.summary)}</p><span class="raw-src">תקציר הכתבה כפי שהתפרסם בפיד של <a href="${first.url}" target="_blank" rel="noopener">${esc(first.source)}</a>. טקסט גולמי של המקור, לא סיכום מאומת, ועלול להיות חלקי.</span></div>`;
}

function sideSummariesHtml(s) {
  if(s.grouping_status==='unvalidated')return '<p class="note">לא מוצגים סיכומי צדדים או מסקנות על היעדר כיסוי עד להשלמת הקיבוץ.</p>';
  const ready = s.synthesis_status === 'ready' && s.synthesis;
  const anyMergedSide = SIDE_ORDER.some(side=>sideSourceCount(s, side)>=2);
  const intro = !anyMergedSide
    ? 'מוצגים תקצירי הכתבות כפי שהתפרסמו בפיד של כל מקור.'
    : ready ? 'סיכומים אוטומטיים שנבדקו מול הטקסט שנאסף. גם בדיקה אוטומטית עלולה לטעות.' : 'אין סיכום מאומת כרגע. במקומו מוצג תקציר ה-RSS הגולמי של המקור הראשון בכל צד, כפי שהתפרסם - לא אומת ועלול להיות חלקי.';
  return `<h3 class="sec">מה מדווחים לפי צד</h3><p class="note">${intro}</p>` + SIDE_ORDER.map(side => {
    const found=s.articles.some(a=>GROUP_SIDES[side].includes(a.side));
    // Verified rows render only where several sources were actually merged; a single-source
    // side always shows the excerpt as published, even if an older cached summary exists.
    const rows=ready && sideSourceCount(s, side)>=2 ? s.synthesis.sides[side]?.summary || [] : [];
    const absent=DATA.grouping?.partial ? 'לא נכללו כאן כתבות מצד זה. הסיקור חלקי ולכן אין להסיק שלא דווח בנושא.' : groupMonitored(side) ? 'לא נמצאו כתבות בנושא במקורות שבמעקב.' : 'הצד הזה אינו במעקב כרגע.';
    return `<section class="side-summary ${side}"><h3>${SIDE_HE[side]}</h3>${rows.length ? rows.map(row=>`<p>${esc(row.text)}<span class="evidence">${row.evidence_kind==='side_membership'?'מקורות בצד זה (לא ציטוט לכל טענה)':'מקורות'}: ${row.article_ids.map(id=>s.articles[id]).filter(Boolean).map(a=>esc(a.source)).join(' · ')}</span></p>`).join('') : (found ? rawRssHtml(s, side) : `<p>${absent}</p>`)}</section>`;
  }).join('') + (s.caveats||[]).map(c=>`<p class="note">${esc(c)}</p>`).join('');
}

/* Difference bullets are written only for stories covered by both side groups; the pipeline owns qualification. */
function comparisonHtml(s) {
  if (!s.comparison) return '';
  const srcs = (ids, cls) => `<span class="srcs ${cls}">(${ids.map(id => s.articles[id]).filter(Boolean).map(a => `<a href="${a.url}" target="_blank" rel="noopener">${esc(a.source)}</a>`).join(' · ')})</span>`;
  let body;
  if (s.comparison.status !== 'ready' || !s.comparison.bullets.length) {
    body = `<p class="none">לא נמצאו הבדלים ברורים בסיקור בין שני הצדדים.</p>`;
  } else {
    body = '<ul>' + s.comparison.bullets.map(b => {
      if (b.right && b.left)
        return `<li><b class="r">ימין</b>: ${esc(b.right.text)} <b class="l">שמאל</b>: ${esc(b.left.text)} ${srcs(b.right.article_ids, 'right')} ${srcs(b.left.article_ids, 'left')}</li>`;
      if (b.right)
        return `<li>${esc(b.right.text)} - הוזכר רק ב<b class="r">ימין</b> ${srcs(b.right.article_ids, 'right')}</li>`;
      return `<li>${esc(b.left.text)} - הוזכר רק ב<b class="l">שמאל</b> ${srcs(b.left.article_ids, 'left')}</li>`;
    }).join('') + '</ul>';
  }
  return `<h3 class="sec">מה שונה בסיקור</h3><div class="diff">${body}<p class="note">על בסיס הטקסט שנאסף בלבד. פרט שלא הוזכר אצל צד לא בהכרח לא פורסם בו.</p></div>`;
}

function renderDetail(i) {
  const s = DATA.stories[i];
  if (!s) return closeDetail();
  const bySide = {};
  s.articles.forEach(a => (bySide[a.side] = bySide[a.side] || []).push(a));
  document.getElementById('detail').innerHTML = `
    <h2>${esc(s.headline)}</h2>
      ${groupingWarning(s)}
    ${coverageHtml(s)}
    ${comparisonHtml(s)}
    ${sideSummariesHtml(s)}
    <h3 class="sec">מקורות לעיון (לא חובה)</h3>
    ${Object.entries(bySide).map(([side, arts]) => arts.map(a => `
      <a class="src ${side}" href="${a.url}" target="_blank" rel="noopener">
        <span class="name">${esc(a.source)}</span><span class="side-tag ${side}">${SIDE_HE[side] || SIDE_HE.unknown}${a.extraction === 'lead_only' ? ' · פתיח בלבד' : a.extraction === 'partial' ? ' · טקסט חלקי' : ''}</span>
        <div class="title">${esc(a.title)}</div>
        <div class="go">לכתבה המלאה באתר המקור ↗</div>
      </a>`).join('')).join('')}`;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('overlay').scrollTop = 0;
}

function closeDetail() { document.getElementById('overlay').classList.remove('open'); location.hash = '#/'; }
function esc(t) { const d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }

function route() {
  const m = location.hash.match(/^#\/story\/(\d+)/);
  if (m) renderDetail(+m[1]); else document.getElementById('overlay').classList.remove('open');
}

function ago(iso) {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (m < 60) return 'לפני ' + m + ' דקות';
  const h = Math.floor(m / 60);
  if (h < 24) return 'לפני ' + (h === 1 ? 'שעה' : h + ' שעות');
  const d = Math.floor(h / 24);
  return 'לפני ' + (d === 1 ? 'יום' : d + ' ימים');
}

function applyData(d) {
  DATA = d;
  document.getElementById('meta').textContent = 'עודכן ' + ago(d.generated_at);
  const unmonitored = SIDE_ORDER.filter(g => !GROUP_SIDES[g].some(s => d.monitored_sides.includes(s)));
  if (unmonitored.length) {
    const b = document.getElementById('banner');
    b.hidden = false;
    b.textContent = 'שים לב: ' + unmonitored.map(s => SIDE_HE[s]).join(', ') +
      ' אינם במעקב כרגע (מקורות לא מתויגים או תקלה). הפסים מחושבים רק על צדדים במעקב.';
  }
  if(d.grouping && d.grouping.complete) {
    const warning=document.getElementById('grouping-warning');warning.hidden=false;
    warning.textContent='הכתבות קובצו אוטומטית לפי אירוע. ייתכנו צירופים או פיצולים שגויים.';
  }
  if(d.grouping && !d.grouping.complete) {
    const warning=document.getElementById('grouping-warning');warning.hidden=false;
    warning.textContent='תצוגה חלקית: קיבוץ הכתבות לא הושלם. ייתכנו פיצולים או צירופים שגויים; אין להסיק מכאן היעדר כיסוי.';
  }
  const pastBanner=document.getElementById('edition-banner');
  if(CURRENT_EDITION) {
    const entry=EDITIONS.find(e=>e.id===CURRENT_EDITION);
    pastBanner.hidden=false;
    pastBanner.innerHTML='מוצגת מהדורה ישנה'+(entry?' מ-'+esc(editionLabel(entry)):'')+'. <button type="button" id="edition-current">למהדורה האחרונה</button>';
    document.getElementById('edition-current').addEventListener('click',()=>{document.getElementById('edition').value='';switchEdition('');});
  } else { pastBanner.hidden=true; pastBanner.textContent=''; }
  syncControls(); renderFeed(); route();
}

function loadEdition(id) {
  return fetch(editionUrl(id)).then(r => { if (!r.ok) throw new Error('edition fetch failed'); return r.json(); }).then(d => {
    CURRENT_EDITION = id;
    applyData(d);
  });
}

function switchEdition(id) {
  const url=new URL(location.href);
  if(id)url.searchParams.set('edition',id);else url.searchParams.delete('edition');
  history.replaceState(null,'',url);
  closeDetail();
  loadEdition(id).catch(() => { document.getElementById('meta').textContent = 'שגיאה בטעינת המהדורה'; });
}

Promise.all([
  fetch('data.json').then(r => r.json()),
  fetch('history/index.json').then(r => r.ok ? r.json() : { editions: [] }).catch(() => ({ editions: [] })),
]).then(([d, index]) => {
  EDITIONS = (Array.isArray(index.editions) ? index.editions : []).filter(e => e && typeof e.id === 'string' && typeof e.generated_at === 'string');
  populateEditions();
  const wanted = readEdition();
  if (wanted) {
    CURRENT_EDITION = wanted;
    loadEdition(wanted).catch(() => { CURRENT_EDITION = ''; applyData(d); });
  } else {
    applyData(d);
  }
}).catch(() => { document.getElementById('meta').textContent = 'שגיאה בטעינת הנתונים'; });

window.addEventListener('hashchange', route);
window.addEventListener('popstate',()=>{const wanted=readEdition();if(wanted!==CURRENT_EDITION){switchEdition(wanted);return;}syncControls();if(DATA){renderFeed();route();}});
document.getElementById('feed-tools').addEventListener('submit',e=>{e.preventDefault();updateFilters();});
document.getElementById('search').addEventListener('input',updateFilters);
document.getElementById('affiliation').addEventListener('change',updateFilters);
document.getElementById('reset').addEventListener('click',()=>{document.getElementById('search').value='';document.getElementById('affiliation').value='';updateFilters();});
document.getElementById('edition').addEventListener('change',()=>{switchEdition(document.getElementById('edition').value);});
document.getElementById('back').addEventListener('click', closeDetail);
</script>
</body>
</html>

name: Daily digest
on:
  schedule:
    - cron: '20 3 * * *'   # ~05:20-06:20 Israel time (UTC+2/+3); GitHub runs scheduled jobs best-effort
  workflow_dispatch:
    inputs:
      publish:
        description: Publish reviewed data to main
        type: boolean
        default: false
      synthesis:
        description: Enable bounded free synthesis and verification
        type: boolean
        default: false
      grouping:
        description: Use model-led batched grouping (needs synthesis on; staged only unless publish)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: npm test
      - name: Restore synthesis cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: synthesis-v7-${{ github.run_id }}
          restore-keys: synthesis-v7-
      - name: Run pipeline
        env:
          REALNEWS_SYNTHESIS_ENABLED: ${{ inputs.synthesis && 'true' || 'false' }}
          REALNEWS_GROUPING: ${{ inputs.grouping && 'model' || 'lexical' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node src/pipeline.ts
      - name: Preserve staged output
        uses: actions/upload-artifact@v4
        with:
          name: staged-digest
          path: site/data.json
          retention-days: 3
      - name: Private review evidence
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: private-review-evidence
          path: .review/evidence.json
          retention-days: 1
      - name: Commit updated data
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish)
        run: |
          git config user.name "realnews-bot"
          git config user.email "realnews-bot@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "Daily digest $(date -u +%Y-%m-%d)"
          bash scripts/push-with-retry.sh

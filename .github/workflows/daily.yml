name: Daily digest
on:
  schedule:
    # 09:00 and 21:00 Israel time. timezone makes GitHub handle DST; runs are best-effort and can start late.
    - cron: '0 9,21 * * *'
      timezone: 'Asia/Jerusalem'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: npm test
      - name: Run pipeline
        run: node src/pipeline.ts
      - name: Commit updated data
        run: |
          git config user.name "realnews-bot"
          git config user.email "realnews-bot@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "Daily digest $(date -u +%Y-%m-%d)"
          bash scripts/push-with-retry.sh

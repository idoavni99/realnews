name: Daily digest
on:
  schedule:
    # 09:00 and 21:00 Israel time. timezone makes GitHub handle DST; runs are best-effort and can start late.
    - cron: '0 9,21 * * *'
      timezone: 'Asia/Jerusalem'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish reviewed data to main
        type: boolean
        default: false
      synthesis:
        description: Enable bounded synthesis and verification (independent of grouping)
        type: boolean
        default: false
      free_test:
        description: Use openrouter/free for this staged test only (does not change provider default)
        type: boolean
        default: false
      grouping:
        description: Use model-led batched grouping independently (staged; quality gate required)
        type: boolean
        default: false

concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: npm test
      - name: Restore synthesis cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: synthesis-v10-${{ github.run_id }}
          restore-keys: synthesis-v10-
      - name: Run pipeline
        env:
          REALNEWS_SYNTHESIS_ENABLED: ${{ inputs.synthesis && 'true' || 'false' }}
          REALNEWS_GROUPING_BATCH_TOKENS: ${{ vars.REALNEWS_GROUPING_BATCH_TOKENS || '24000' }}
          REALNEWS_GROUPING_MAX_ARTICLES: '6'
          REALNEWS_GROUPING_OUTPUT_TOKENS_PER_ARTICLE: '1500'
          REALNEWS_GROUPING: ${{ (inputs.grouping || (github.event_name == 'schedule' && vars.REALNEWS_GROUPING == 'model')) && 'model' || 'lexical' }}
          OPENROUTER_MODEL: ${{ inputs.free_test && 'openrouter/free' || vars.OPENROUTER_MODEL || 'openrouter/auto' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node src/pipeline.ts
      - name: Save verified synthesis checkpoints
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: synthesis-v10-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve staged output
        if: always() && github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: staged-digest
          path: .review/staged-data.json
          retention-days: 3
      - name: Private review evidence
        if: always() && github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: private-review-evidence
          path: |
            .review/evidence.json
            .review/calls.json
            .review/grouping.json
            .review/articles.json
          retention-days: 1
      - name: Publication quality gate
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish)
        env:
          REALNEWS_AUTOPUBLISH_GROUPING: ${{ vars.REALNEWS_AUTOPUBLISH_GROUPING }}
        run: node scripts/publication-gate.ts
      - name: Commit updated data
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish)
        run: |
          git config user.name "realnews-bot"
          git config user.email "realnews-bot@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "Daily digest $(date -u +%Y-%m-%d)"
          bash scripts/push-with-retry.sh

  deploy-pages:
    needs: build
    if: github.event.repository.visibility == 'public' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish)
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
